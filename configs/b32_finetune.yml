# Looped-DiT B/32 fine-tuning: Std-120K, 40k steps from the 250k pretraining checkpoint.

# Architecture
image_size: 512
patch_size: 32
hidden_size: 768
num_heads: 12
head_dim: 64
mlp_ratio: 2.6667
pca_channels: 128
text_preamble_depth: 2
loop_split: [6, 5, 6]                  # pre-loop / looped / post-loop blocks

# Looped-DiT components (toggle to ablate)
num_loops: 4                           # loop depth N; 1 disables looping
share_loop_weights: true               # false: untied passes (compute-matched "deeper" baseline)
deep_supervision: true                 # flow loss on every loop exit
deep_supervision_weighting: final_plus_mean  # final_plus_mean | exponential | uniform
use_xsa: true                          # exclusive self-attention in the looped blocks
use_attn_gate: false                   # head-wise sigmoid gate in the looped blocks

# Data: Std-120K (BLIP3o-60K, DALL-E 3, ShareGPT-4o-Image)
dataset: webdataset
webdataset_sources:
  blip3o_60k:
    path: ${DATA_ROOT}/finetune/blip3o_60k
    weight: 0.06
  dalle3:
    path: ${DATA_ROOT}/finetune/dalle3
    weight: 0.016
  sharegpt4o:
    path: ${DATA_ROOT}/finetune/sharegpt4o
    weight: 0.04
shuffle_buffer: 1000

# Optimization. Reference setup: 16 GPUs x 32 per GPU x 2 accumulation steps; accumulation adapts to the GPU count.
batch_size: 1024
micro_batch_size: 32
num_steps: 290000                      # continues the pretraining step counter
warmup_steps: 0                        # the step counter continues from pretraining, past its warmup
learning_rate: 4.0e-4
adam_beta2: 0.95
weight_decay: 0.0
max_grad_norm: 0.1
ema_decay: 0.99995

# Flow matching
noise_scale: 2.0
t_logit_mean: -0.8
t_logit_std: 0.8
label_drop_rate: 0.1
